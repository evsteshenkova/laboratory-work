<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Student Risk BBKemsu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Students Risk BBKemsu эндпоинты</h4>
                </div>
                <div class="card-body">
                    <div class="list-group">
                        <a href="/api/students"
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                           target="_blank">
                            <div>
                                <span class="badge bg-success me-2">GET</span>
                                <code>/api/students</code>
                            </div>
                            <span class="text-primary">↗</span>
                        </a>

                        <a href="/api/students/1"
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                           target="_blank">
                            <div>
                                <span class="badge bg-success me-2">GET</span>
                                <code>/api/students/1</code>
                            </div>
                            <span class="text-primary">↗</span>
                        </a>

                        <a href="/db-check"
                           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                           target="_blank">
                            <div>
                                <span class="badge bg-success me-2">GET</span>
                                <code>/db-check</code>
                            </div>
                            <span class="text-primary">↗</span>
                        </a>
                    </div>

                    <div class="mt-4">
                        <h5>Другие методы</h5>
                        <div class="list-group">
                            <div class="list-group-item">
                                <span class="badge bg-warning me-2">POST</span>
                                <code>/api/students</code>
                                <small class="text-secondary d-block mt-1">Создать студента</small>
                            </div>
                            <div class="list-group-item">
                                <span class="badge bg-primary me-2">PUT</span>
                                <code>/api/students/<b>id</b></code>
                                <small class="text-secondary d-block mt-1">Обновить студента</small>
                            </div>
                            <div class="list-group-item">
                                <span class="badge bg-danger me-2">DELETE</span>
                                <code>/api/students/<b>id</b></code>
                                <small class="text-secondary d-block mt-1">Удалить студента</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer text-secondary text-center">
                    Нажмите на ссылку для открытия в новой вкладке
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
